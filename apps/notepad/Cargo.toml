[package]
name = "nyx-notepad"
version = "0.1.0"
description = "A plain-text notepad for Omarchy with tabs, adjustable fonts and sessions that keep unsaved text"
license = "MIT"
repository = "https://github.com/design-nexus/nyx-notepad"
authors = ["Ken Smith"]
edition = "2024"

[[bin]]
name = "nyx-notepad"
path = "src/main.rs"

[dependencies]
nyx-core = { git = "https://github.com/design-nexus/nyx-core.git", rev = "32f0c5e154fc44c763b8ecd80d35a3b298723afa" }
serde_json = "1"
nyx-ui = { git = "https://github.com/design-nexus/nyx-design.git", rev = "4f8e16d6ae3dbc2a14091271e3b6bb29902c0df4" }
nyx-theme = { git = "https://github.com/design-nexus/nyx-design.git", rev = "4f8e16d6ae3dbc2a14091271e3b6bb29902c0df4" }
anyhow = "1.0.104"
gtk = { version = "0.11", package = "gtk4", features = ["v4_18"] }
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.1.6"
