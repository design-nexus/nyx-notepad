[package]
name = "nyx-notepad"
version = "0.1.0"
description = "A plain-text notepad for Omarchy with tabs, adjustable fonts and sessions that keep unsaved text"
license = "MIT"
repository = "https://github.com/design-nexus/nyx-notepad"
authors = ["Ken Smith"]
edition = "2024"

[[bin]]
name = "nyx-notepad"
path = "src/main.rs"

[dependencies]
nyx-core = { git = "https://github.com/design-nexus/nyx-core.git", rev = "4378e243aeb09733843996663cd9a5a7f0cbb821" }
serde_json = "1"
nyx-ui = { git = "https://github.com/design-nexus/nyx-design.git", rev = "40db521bab468d54f18f65c6aabd7fc8533d6a4d" }
nyx-theme = { git = "https://github.com/design-nexus/nyx-design.git", rev = "40db521bab468d54f18f65c6aabd7fc8533d6a4d" }
anyhow = "1.0.104"
gtk = { version = "0.11", package = "gtk4", features = ["v4_18"] }
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.1.6"
