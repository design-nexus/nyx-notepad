[package]
name = "nyx-notepad"
version = "0.1.0"
description = "A plain-text notepad for Omarchy with tabs, adjustable fonts and sessions that keep unsaved text"
license = "MIT"
repository = "https://github.com/design-nexus/nyx-notepad"
authors = ["Ken Smith"]
edition = "2024"

[[bin]]
name = "nyx-notepad"
path = "src/main.rs"

[dependencies]
nyx-core = { git = "https://github.com/design-nexus/nyx-core.git", rev = "94e0c8aa133074c74adb31365e51f56168114f68" }
serde_json = "1"
nyx-ui = { git = "https://github.com/design-nexus/nyx-design.git", rev = "ea8839d237a23ec83887429475f0780c06a36826" }
nyx-theme = { git = "https://github.com/design-nexus/nyx-design.git", rev = "ea8839d237a23ec83887429475f0780c06a36826" }
anyhow = "1.0.104"
gtk = { version = "0.11", package = "gtk4", features = ["v4_18"] }
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.1.6"
encoding_rs = "0.8.44"
chardetng = "1.0.0"
